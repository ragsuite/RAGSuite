name: CE release draft

# Draft CE release on v* tags: CycloneDX SBOM + cosign keyless signing (Sigstore / OIDC).
# Does not publish to npm (that stays manual in cli-publish.yml).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without v prefix) for manual draft"
        required: false
        type: string

permissions:
  contents: write   # create the release
  id-token: write   # REQUIRED for cosign keyless signing (OIDC)

jobs:
  draft-release:
    name: Draft GitHub Release (SBOM + signatures, no npm publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          INPUT="${{ github.event.inputs.version }}"
          if [[ -n "$INPUT" ]]; then
            VERSION="$INPUT"
            TAG="v$VERSION"
          elif [[ "$TAG" == v* ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="$(node -e "console.log(require('./cli/package.json').version)")"
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ---------- SBOM ----------
      # Explicit sources: declared Python deps from requirements.txt + Syft for
      # CLI/frontend. Whole-repo Syft missed PyPI; file:requirements.txt alone is
      # also incomplete in Syft 1.51 — so Python is built from the manifest.
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.51.1
          syft version

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"

          # Declared Python runtime deps (CI has no backend/.venv)
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          req = Path("backend/requirements.txt").read_text().splitlines()
          components = []
          seen = set()
          for raw in req:
              line = raw.split("#", 1)[0].strip()
              if not line or line.startswith("-"):
                  continue
              # strip extras: uvicorn[standard]>=0.24.0
              m = re.match(
                  r"^([A-Za-z0-9][A-Za-z0-9_.+-]*)(?:\[[^\]]*\])?\s*([=<>!~].+)?$",
                  line,
              )
              if not m:
                  continue
              name = m.group(1)
              key = name.lower().replace("_", "-")
              if key in seen:
                  continue
              seen.add(key)
              version_constraint = (m.group(2) or "").strip() or None
              purl = f"pkg:pypi/{key}"
              if version_constraint and version_constraint.startswith("=="):
                  ver = version_constraint[2:].strip()
                  purl = f"pkg:pypi/{key}@{ver}"
              comp = {
                  "type": "library",
                  "name": name,
                  "purl": purl,
                  "bom-ref": purl,
              }
              if version_constraint and version_constraint.startswith("=="):
                  comp["version"] = version_constraint[2:].strip()
              components.append(comp)

          out = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.6",
              "version": 1,
              "metadata": {
                  "component": {
                      "type": "application",
                      "name": "ragsuite-ce-python",
                      "version": "from-requirements",
                  }
              },
              "components": components,
          }
          Path("sbom-python.json").write_text(json.dumps(out, indent=2) + "\n")
          print(f"Python declared components: {len(components)}")
          PY

          syft "cli" -o "cyclonedx-json=sbom-cli.json"
          syft "frontend" -o "cyclonedx-json=sbom-frontend.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          ver = """${{ steps.version.outputs.version }}"""
          out = Path(f"ragsuite-ce-{ver}.cdx.json")
          inputs = [
              Path("sbom-python.json"),
              Path("sbom-cli.json"),
              Path("sbom-frontend.json"),
          ]

          merged = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.6",
              "version": 1,
              "metadata": {
                  "component": {
                      "type": "application",
                      "name": "ragsuite-ce",
                      "version": ver,
                  }
              },
              "components": [],
          }
          seen = set()
          for path in inputs:
              doc = json.loads(path.read_text())
              for comp in doc.get("components") or []:
                  key = (
                      comp.get("bom-ref")
                      or comp.get("purl")
                      or f"{comp.get('type')}:{comp.get('name')}:{comp.get('version')}"
                  )
                  if key in seen:
                      continue
                  seen.add(key)
                  merged["components"].append(comp)

          out.write_text(json.dumps(merged, indent=2) + "\n")
          print(f"Wrote {out} with {len(merged['components'])} components")
          PY

      - name: Assert SBOM includes Python runtime deps
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          python3 - <<PY
          import json
          from pathlib import Path

          path = Path("ragsuite-ce-${VER}.cdx.json")
          doc = json.loads(path.read_text())
          names = {(c.get("name") or "").lower().replace("_", "-") for c in doc.get("components") or []}
          required = ["fastapi", "redis", "sqlalchemy"]
          missing = [n for n in required if n not in names and not any(n in x for x in names)]
          if not any("psycopg" in x for x in names):
              missing.append("psycopg2")
          if missing:
              raise SystemExit(f"SBOM missing required Python packages: {missing}")
          print(f"SBOM Python coverage OK ({len(doc.get('components') or [])} components)")
          PY

      # ---------- source tarball ----------
      # A stable, reproducible archive of the tagged tree, so there is a concrete
      # artifact to sign and for users to verify against.
      - name: Create source archive
        run: |
          git archive --format=tar.gz \
            --prefix="ragsuite-ce-${{ steps.version.outputs.version }}/" \
            -o "ragsuite-ce-${{ steps.version.outputs.version }}.tar.gz" \
            "${{ steps.version.outputs.tag }}" 2>/dev/null \
          || git archive --format=tar.gz \
            --prefix="ragsuite-ce-${{ steps.version.outputs.version }}/" \
            -o "ragsuite-ce-${{ steps.version.outputs.version }}.tar.gz" HEAD

      - name: Checksums
        run: |
          sha256sum \
            "ragsuite-ce-${{ steps.version.outputs.version }}.tar.gz" \
            "ragsuite-ce-${{ steps.version.outputs.version }}.cdx.json" \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ---------- signing ----------
      # Keyless: identity comes from the GitHub OIDC token, the signature and the
      # certificate go to the public Rekor transparency log. No secrets to rotate.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts
        run: |
          for f in \
            "ragsuite-ce-${{ steps.version.outputs.version }}.tar.gz" \
            "ragsuite-ce-${{ steps.version.outputs.version }}.cdx.json" \
            SHA256SUMS.txt
          do
            cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              "$f"
          done

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "RAGSuite CE ${{ steps.version.outputs.version }}" \
            --draft \
            --notes "$(cat <<'EOF'
          Draft CE release.

          Included:
          - Community platform source
          - CLI package version from `cli/package.json`
          - CycloneDX SBOM (`*.cdx.json`)
          - cosign signatures (`*.sig`) and certificates (`*.pem`)
          - `SHA256SUMS.txt`

          Verify a downloaded artifact:

          ```bash
          cosign verify-blob \
            --certificate ragsuite-ce-<version>.tar.gz.pem \
            --signature   ragsuite-ce-<version>.tar.gz.sig \
            --certificate-identity-regexp 'https://github.com/ragsuite/RAGSuite/.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ragsuite-ce-<version>.tar.gz
          ```

          Publishing gates:
          - npm publish remains manual via `.github/workflows/cli-publish.yml`
          - confirm input must be exactly `publish`
          - CLI version comes from `cli/package.json`
          EOF
          )" \
            "ragsuite-ce-${{ steps.version.outputs.version }}.tar.gz" \
            "ragsuite-ce-${{ steps.version.outputs.version }}.tar.gz.sig" \
            "ragsuite-ce-${{ steps.version.outputs.version }}.tar.gz.pem" \
            "ragsuite-ce-${{ steps.version.outputs.version }}.cdx.json" \
            "ragsuite-ce-${{ steps.version.outputs.version }}.cdx.json.sig" \
            "ragsuite-ce-${{ steps.version.outputs.version }}.cdx.json.pem" \
            SHA256SUMS.txt \
            SHA256SUMS.txt.sig \
            SHA256SUMS.txt.pem
