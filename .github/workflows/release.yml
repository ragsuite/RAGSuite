name: CE release draft

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without v prefix) for manual draft"
        required: false
        type: string

permissions:
  contents: write

jobs:
  draft-release:
    name: Draft GitHub Release (no npm publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          INPUT="${{ github.event.inputs.version }}"
          if [[ -n "$INPUT" ]]; then
            VERSION="$INPUT"
            TAG="v$VERSION"
          elif [[ "$TAG" == v* ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="$(node -e "console.log(require('./cli/package.json').version)")"
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "RAGSuite CE ${{ steps.version.outputs.version }}" \
            --notes "$(cat <<'EOF'
          Draft CE release.

          Included:
          - Community platform source
          - CLI package version from `cli/package.json`

          Publishing gates:
          - npm publish remains manual via `.github/workflows/cli-publish.yml`
          - confirm input must be exactly `publish`
          - CLI version comes from `cli/package.json` (0.2.0+)
          EOF
          )" \
            --draft
