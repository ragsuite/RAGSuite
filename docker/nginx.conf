# Static upstream kept as a comment-only contract: workers are never listed.
# Live replica discovery uses Docker DNS + a variable proxy_pass (OSS nginx).
# `server … resolve` is Plus-only; variable pass is Docker DNS round-robin.
# Workers are never listed here.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1024m;
    include /etc/nginx/snippets/docker-resolver.conf;

    # Host maps 9091→80. Absolute redirects would emit Location: http://localhost/...
    # (no :9091) and break hard refresh on routes that also have a directory.
    absolute_redirect off;
    port_in_redirect off;

    include /etc/nginx/snippets/robots-noindex.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # CanvasKit / Skia — never fall back to index.html for missing wasm
    location = /canvaskit.wasm {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/robots-noindex.conf;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/robots-noindex.conf;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        include /etc/nginx/snippets/robots-noindex.conf;
        return 200 'ok';
    }

    # Embeddable widget assets — CORS for cross-origin TYPO3 / external embeds.
    # Init + loader must revalidate so customers pick up AppChat / AppSearch embeds.
    location ~ ^/(widget|search-widget)/v1/(ragsuite-init|loader)\.js$ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/robots-noindex.conf;
        try_files $uri =404;
    }

    location ~ ^/(widget|search-widget)/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/robots-noindex.conf;
        try_files $uri =404;
    }

    # $embed_csp comes from http-context map in 00-embed-csp-map.conf:
    # empty upstream X-Embed-CSP → fail-open frame-ancestors * (never 'self').
    # Production: redeploy the web image after changing this block.

    # /embed/* HTML is framed by customer sites. Do not set X-Frame-Options.
    # frame-ancestors comes from Allowed Domains via API (Docker/production only).
    #
    # auth_request re-runs `set` in this location with empty $arg_*. Plain
    # `set $embed_project $arg_projectid` therefore intermittently wipes the
    # project and yields frame-ancestors 'self'. Concatenation keeps the
    # main-request value: set $v "${arg_…}${v}".
    # Capture camelCase (loaders) and snake_case query forms.
    # Do NOT append ?$args onto the auth_request URI (exact location match breaks).
    location ^~ /embed/search {
        set $embed_project "${arg_projectid}${arg_project_id}${embed_project}";
        set $embed_parent "${arg_parentorigin}${arg_parent_origin}${embed_parent}";
        error_page 500 502 503 504 = @embed_without_policy;
        auth_request /internal/embed-policy-search;
        auth_request_set $embed_csp_upstream $upstream_http_x_embed_csp;
        add_header Content-Security-Policy $embed_csp always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/robots-noindex.conf;
        try_files $uri.html $uri $uri/index.html /index.html;
    }

    location ^~ /embed/chatbot {
        set $embed_project "${arg_projectid}${arg_project_id}${embed_project}";
        set $embed_parent "${arg_parentorigin}${arg_parent_origin}${embed_parent}";
        error_page 500 502 503 504 = @embed_without_policy;
        auth_request /internal/embed-policy-chat;
        auth_request_set $embed_csp_upstream $upstream_http_x_embed_csp;
        add_header Content-Security-Policy $embed_csp always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/robots-noindex.conf;
        try_files $uri.html $uri $uri/index.html /index.html;
    }

    location ^~ /embed/ {
        set $embed_project "${arg_projectid}${arg_project_id}${embed_project}";
        set $embed_parent "${arg_parentorigin}${arg_parent_origin}${embed_parent}";
        error_page 500 502 503 504 = @embed_without_policy;
        auth_request /internal/embed-policy-chat;
        auth_request_set $embed_csp_upstream $upstream_http_x_embed_csp;
        add_header Content-Security-Policy $embed_csp always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/robots-noindex.conf;
        try_files $uri.html $uri $uri/index.html /index.html;
    }

    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream;
    }

    location = /internal/embed-policy-search {
        internal;
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream/api/v1/widget/embed-frame-policy?project_id=$embed_project&surface=search;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Embed-Project-Id $embed_project;
        proxy_set_header X-Embed-Parent-Origin $embed_parent;
        # Synthetic URI for parentOrigin narrowing + project URI fallback on the API.
        proxy_set_header X-Original-URI /embed/search?projectId=$embed_project&parentOrigin=$embed_parent;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location = /internal/embed-policy-chat {
        internal;
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream/api/v1/widget/embed-frame-policy?project_id=$embed_project&surface=chat;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Embed-Project-Id $embed_project;
        proxy_set_header X-Embed-Parent-Origin $embed_parent;
        proxy_set_header X-Original-URI /embed/chatbot?projectId=$embed_project&parentOrigin=$embed_parent;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location @embed_without_policy {
        # Policy API blip (5xx/timeout) must not hide third-party iframes.
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/robots-noindex.conf;
        try_files $uri.html $uri $uri/index.html /index.html;
    }

    # Expo static export lays out both `chatbot-config.html` and `chatbot-config/`.
    # Prefer `$uri.html` first — if `$uri` matches the directory, nginx 301s to
    # `/chatbot-config/` with Location host:port of the container (drops :9091).
    location / {
        try_files $uri.html $uri $uri/index.html /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/robots-noindex.conf;
        try_files $uri =404;
    }
}

# Public API listener — same Docker-DNS backend as /api on :80. Workers are never listed here.
server {
    listen 9090;
    server_name _;
    client_max_body_size 1024m;
    include /etc/nginx/snippets/docker-resolver.conf;
    include /etc/nginx/snippets/robots-noindex.conf;

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        include /etc/nginx/snippets/robots-noindex.conf;
        return 200 'ok';
    }

    location / {
        include /etc/nginx/snippets/api-proxy.conf;
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream;
    }
}
