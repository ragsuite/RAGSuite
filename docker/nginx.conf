server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Host maps 9091→80. Absolute redirects would emit Location: http://localhost/...
    # (no :9091) and break hard refresh on routes that also have a directory.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # CanvasKit / Skia — never fall back to index.html for missing wasm
    location = /canvaskit.wasm {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Embeddable widget assets — CORS for cross-origin TYPO3 / external embeds.
    # Init + loader must revalidate so customers pick up AppChat / AppSearch embeds.
    location ~ ^/(widget|search-widget)/v1/(ragsuite-init|loader)\.js$ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~ ^/(widget|search-widget)/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # $embed_csp must exist at server scope for auth_request_set.
    # Do not initialize $embed_project / $embed_path here: server-level `set`
    # re-runs on the auth_request subrequest and would wipe the parent values.
    set $embed_csp "frame-ancestors 'self'";

    # /embed/* HTML is framed by customer sites. Do not set X-Frame-Options.
    # frame-ancestors comes from Allowed Domains via API (Docker/production only).
    location ^~ /embed/ {
        set $embed_project $arg_projectid;
        set $embed_path $request_uri;
        error_page 500 502 503 504 = @embed_without_policy;
        auth_request /internal/embed-frame-policy;
        auth_request_set $embed_csp $upstream_http_x_embed_csp;
        add_header Content-Security-Policy $embed_csp always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri.html $uri $uri/index.html /index.html;
    }

    location = /internal/embed-frame-policy {
        internal;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $embed_policy_upstream http://backend:8000;
        proxy_pass $embed_policy_upstream/api/v1/widget/embed-frame-policy?project_id=$embed_project;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Embed-Project-Id $embed_project;
        proxy_set_header X-Original-URI $embed_path;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location @embed_without_policy {
        # Policy API blip must not hide third-party iframes (pre-change behavior).
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri.html $uri $uri/index.html /index.html;
    }

    # Expo static export lays out both `chatbot-config.html` and `chatbot-config/`.
    # Prefer `$uri.html` first — if `$uri` matches the directory, nginx 301s to
    # `/chatbot-config/` with Location host:port of the container (drops :9091).
    location / {
        try_files $uri.html $uri $uri/index.html /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
