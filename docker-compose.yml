# RAGSuite Server — full stack (backend + frontend web + data stores).
# Sibling stacks use :8000/:8001/:8002/:8003/:5435/:6380/:8081 — this project does not.
#
# Quick start (attaches EE when available): npm run start:docker
# Preferred: npm run start:docker  (auto-attaches sibling RAGSUITE_EE or ACTIVE bundle)
# Raw Compose CE-only:
#   docker compose up --build
# Raw Compose + live sibling EE (frontend + backend must share the same path):
#   RAGSUITE_EE_DOCKER_CONTEXT=/abs/path/to/RAGSUITE_EE docker compose up --build
# Or use the overlay (same effect):
#   RAGSUITE_EE_ROOT=../RAGSUITE_EE docker compose -f docker-compose.yml -f docker/docker-compose.ee.yml up --build
#
# Host ports (this project only — override via .env):
#   API      http://localhost:${API_PORT:-9090}
#   Web UI   http://localhost:${WEB_PORT:-9191}  (same as native Expo)
#   Postgres localhost:${POSTGRES_HOST_PORT:-5436}  (db: ragsuite_v3)
#   Redis    localhost:${REDIS_HOST_PORT:-6382}
# Vectors live in Postgres (pgvector, schema ``ragvec``). The one-shot vector-migrate
# service imports a legacy backend/data/chroma_db once (verified), before the API starts.

name: ragsuite-server

networks:
  ragsuite-server-net:
    name: ragsuite-server-net

services:
  postgres:
    # postgres:15-alpine + pgvector (same musl base as existing volumes — see Dockerfile).
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    image: ragsuite-postgres-pgvector:15
    # Parallel HNSW index builds use dynamic shared memory; Docker's default 64MB /dev/shm is too small.
    shm_size: ${PG_SHM_SIZE:-1g}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - max_parallel_maintenance_workers=${PG_MAX_PARALLEL_MAINTENANCE_WORKERS:-2}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragsuite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragsuite}
      POSTGRES_DB: ${POSTGRES_DB:-ragsuite_v3}
    ports:
      - "${POSTGRES_HOST_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ragsuite-server-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6382}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ragsuite-server-net
    restart: unless-stopped

  # One-shot: migrations + legacy Chroma -> pgvector import (idempotent, verified).
  # The API starts only after it exits 0; later runs exit immediately.
  vector-migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "app.services.rag.vector_store.chroma_import", "--auto"]
    healthcheck:
      disable: true
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ragsuite}:${POSTGRES_PASSWORD:-ragsuite}@postgres:5432/${POSTGRES_DB:-ragsuite_v3}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CHROMA_IMPORT_PATH: /data/chroma
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Legacy Chroma data (read for the import only; safe to delete after sign-off).
      - ${CHROMA_HOST_PERSIST_PATH:-./backend/data/chroma_db}:/data/chroma
    networks:
      - ragsuite-server-net
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      DEBUG: "True"
      CORS_ORIGINS: "http://localhost:${WEB_PORT:-9191}"
      ENABLE_SCHEDULER: "true"
      ENABLE_DURABLE_JOBS: "true"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ragsuite}:${POSTGRES_PASSWORD:-ragsuite}@postgres:5432/${POSTGRES_DB:-ragsuite_v3}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DOCUMENT_STAGING_DIR: /data/staging
      RUN_INLINE_WORKER: "false"
      WEB_CONCURRENCY: "2"
      FRONTEND_BASE_URL: http://localhost:${WEB_PORT:-9191}
      PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-9090}/api/v1
      SSO_CALLBACK_BASE_URL: http://localhost:${API_PORT:-9090}/api/v1/auth/sso/callback
      # Must match frontend additional_contexts.ee — otherwise UI shows EE routes but API 404s.
      RAGSUITE_EE_ROOT: /ee
      # localhost inside a container is the container itself; reach the host's Ollama instead.
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-9090}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vector-migrate:
        condition: service_completed_successfully
    healthcheck:
      # Use /ping (liveness) — /ready also checks the vector store and can flap during boot.
      # Dockerfile HEALTHCHECK already uses /ping; keep compose aligned.
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - ${DOCUMENT_STAGING_HOST_PATH:-./backend/data/staging}:/data/staging
      # Host runtime (activate / update): offline.key + installed EE stay outside the image
      - ./.ragsuite:/app/.ragsuite
      - ./extensions/installed:/app/extensions/installed
      # Same host path as frontend `ee` build context (stubs = CE-only; sibling EE = DX).
      - ${RAGSUITE_EE_DOCKER_CONTEXT:-./frontend/src/platform/ee-stubs}:/ee:ro
    networks:
      - ragsuite-server-net
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    entrypoint: []
    command: ["python", "-m", "app.worker"]
    # Image HEALTHCHECK probes :8000 (API); worker has no HTTP server.
    healthcheck:
      disable: true
    env_file:
      - .env
    environment:
      DEBUG: "True"
      CORS_ORIGINS: "http://localhost:${WEB_PORT:-9191}"
      ENABLE_SCHEDULER: "true"
      ENABLE_DURABLE_JOBS: "true"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ragsuite}:${POSTGRES_PASSWORD:-ragsuite}@postgres:5432/${POSTGRES_DB:-ragsuite_v3}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DOCUMENT_STAGING_DIR: /data/staging
      RAGSUITE_EE_ROOT: /ee
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ${DOCUMENT_STAGING_HOST_PATH:-./backend/data/staging}:/data/staging
      - ./.ragsuite:/app/.ragsuite
      - ./extensions/installed:/app/extensions/installed
      - ${RAGSUITE_EE_DOCKER_CONTEXT:-./frontend/src/platform/ee-stubs}:/ee:ro
    networks:
      - ragsuite-server-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        FRONTEND_API_URL: ${FRONTEND_API_URL:-http://localhost:9090}
      additional_contexts:
        # Must stay in sync with backend/worker /ee bind mount above.
        # docker-start.sh sets this to sibling RAGSUITE_EE or ACTIVE bundle, else stubs.
        ee: ${RAGSUITE_EE_DOCKER_CONTEXT:-./frontend/src/platform/ee-stubs}
    ports:
      - "${WEB_PORT:-9191}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ragsuite-server-net
    restart: unless-stopped

volumes:
  # Postgres stays as a named volume (native mode already uses this compose service).
  # Staging (and the legacy Chroma import source) are bind-mounted from backend/data/*
  # so npm start and npm run start:docker share the same files.
  postgres_data:
