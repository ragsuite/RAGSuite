# RAGSuite Server — full stack (backend + frontend web + data stores).
# Sibling stacks use :8000/:8001/:8002/:8003/:5435/:6380/:8081 — this project does not.
#
# Start (same named volumes either way — never down -v):
#   docker compose up -d --build          # API ×2 + Worker ×2 by default
#   npm run start:docker                 # same compose + EE attach
#   npm start                            # host API :9090 + Expo :9191; data services only
# Scale: API_REPLICAS / WORKER_REPLICAS (default 2). Data plane stays 1 each.
#
# Host ports (this project only — override via .env):
#   API      http://localhost:${API_PORT:-9090}  (Nginx → API × N)
#   Web UI   http://localhost:${WEB_PORT:-9191}  (Nginx static + /api)
#   Postgres localhost:${POSTGRES_HOST_PORT:-5436}  (db: ragsuite_v3, metadata + jobs)
#   Redis    localhost:${REDIS_HOST_PORT:-6382}
#   ES       localhost:${ELASTICSEARCH_HOST_PORT:-9210}
#   MinIO    localhost:${MINIO_API_HOST_PORT:-9010}  (console :9011)
# Chunks/vectors live in Elasticsearch. Blobs live in MinIO.
# Never: docker compose down -v  (wipes postgres / ES / MinIO volumes).
# Hosted Linux: vm.max_map_count >= 262144. Low Docker RAM → ES red/unassigned shards.

name: ragsuite-server

networks:
  ragsuite-server-net:
    name: ragsuite-server-net

services:
  postgres:
    # postgres:15-alpine + pgvector (migrate source + metadata). Do not drop the extension.
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    image: ragsuite-postgres-pgvector:15
    shm_size: ${PG_SHM_SIZE:-1g}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - max_parallel_maintenance_workers=${PG_MAX_PARALLEL_MAINTENANCE_WORKERS:-2}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragsuite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragsuite}
      POSTGRES_DB: ${POSTGRES_DB:-ragsuite_v3}
    ports:
      - "${POSTGRES_HOST_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ragsuite-server-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6382}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ragsuite-server-net
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.11.3
    environment:
      - node.name=ragsuite-es
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:-ragsuite}
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      # Percent watermarks: byte floors (2gb flood) freeze writes on small Docker disks.
      - cluster.routing.allocation.disk.watermark.low=95%
      - cluster.routing.allocation.disk.watermark.high=97%
      - cluster.routing.allocation.disk.watermark.flood_stage=99%
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${ELASTICSEARCH_HOST_PORT:-9210}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTICSEARCH_PASSWORD:-ragsuite} http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - ragsuite-server-net
    restart: unless-stopped

  minio:
    # Official minio/minio was removed from Docker Hub / Quay (2026).
    # Silo is S3-compatible, same server CLI and /data layout — existing minio_data stays valid.
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ragsuite}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ragsuite-minio-secret}
    ports:
      - "${MINIO_API_HOST_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9011}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ragsuite-server-net
    restart: unless-stopped

  # One-shot: Alembic + legacy Chroma→pgvector + pgvector→ES + blobs→MinIO.
  # The API starts only after it exits 0; later runs exit immediately.
  vector-migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "app.services.stack_migrate", "--auto"]
    healthcheck:
      disable: true
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ragsuite}:${POSTGRES_PASSWORD:-ragsuite}@postgres:5432/${POSTGRES_DB:-ragsuite_v3}
      DOCUMENT_STAGING_DIR: /data/staging
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CHROMA_IMPORT_PATH: /data/chroma
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USER: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-ragsuite}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-ragsuite}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ragsuite-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-ragsuite}
      MINIO_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ${CHROMA_HOST_PERSIST_PATH:-./backend/data/chroma_db}:/data/chroma
      - ${DOCUMENT_STAGING_HOST_PATH:-./backend/data/staging}:/data/staging:ro
    networks:
      - ragsuite-server-net
    restart: "no"

  backend:
    # Horizontal scale (Nginx least_conn → backend:8000). Override: API_REPLICAS=4
    deploy:
      replicas: ${API_REPLICAS:-2}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: "True"
      CORS_ORIGINS: "http://localhost:${WEB_PORT:-9191}"
      ENABLE_SCHEDULER: "true"
      ENABLE_DURABLE_JOBS: "true"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ragsuite}:${POSTGRES_PASSWORD:-ragsuite}@postgres:5432/${POSTGRES_DB:-ragsuite_v3}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RUN_INLINE_WORKER: "false"
      WEB_CONCURRENCY: "2"
      FRONTEND_BASE_URL: http://localhost:${WEB_PORT:-9191}
      PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-9090}/api/v1
      SSO_CALLBACK_BASE_URL: http://localhost:${API_PORT:-9090}/api/v1/auth/sso/callback
      RAGSUITE_EE_ROOT: /ee
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USER: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-ragsuite}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-ragsuite}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ragsuite-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-ragsuite}
      MINIO_SECURE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      vector-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - ./.ragsuite:/app/.ragsuite
      - ./extensions/installed:/app/extensions/installed
      - ${RAGSUITE_EE_DOCKER_CONTEXT:-./frontend/src/platform/ee-stubs}:/ee:ro
    networks:
      - ragsuite-server-net
    restart: unless-stopped

  worker:
    # Horizontal scale; jobs stay Postgres SKIP LOCKED. Override: WORKER_REPLICAS=4
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    entrypoint: []
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: "True"
      CORS_ORIGINS: "http://localhost:${WEB_PORT:-9191}"
      ENABLE_SCHEDULER: "false"
      ENABLE_DURABLE_JOBS: "true"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ragsuite}:${POSTGRES_PASSWORD:-ragsuite}@postgres:5432/${POSTGRES_DB:-ragsuite_v3}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RAGSUITE_EE_ROOT: /ee
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USER: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-ragsuite}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-ragsuite}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ragsuite-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-ragsuite}
      MINIO_SECURE: "false"
      WORKER_ROLES: index,sync,misc
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./.ragsuite:/app/.ragsuite
      - ./extensions/installed:/app/extensions/installed
      - ${RAGSUITE_EE_DOCKER_CONTEXT:-./frontend/src/platform/ee-stubs}:/ee:ro
    networks:
      - ragsuite-server-net
    restart: unless-stopped

  worker-crawl:
    deploy:
      replicas: ${CRAWL_WORKER_REPLICAS:-1}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    entrypoint: []
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: "True"
      CORS_ORIGINS: "http://localhost:${WEB_PORT:-9191}"
      ENABLE_SCHEDULER: "false"
      ENABLE_DURABLE_JOBS: "true"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ragsuite}:${POSTGRES_PASSWORD:-ragsuite}@postgres:5432/${POSTGRES_DB:-ragsuite_v3}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RAGSUITE_EE_ROOT: /ee
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USER: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-ragsuite}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-ragsuite}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ragsuite-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-ragsuite}
      MINIO_SECURE: "false"
      WORKER_ROLES: crawl
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./.ragsuite:/app/.ragsuite
      - ./extensions/installed:/app/extensions/installed
      - ${RAGSUITE_EE_DOCKER_CONTEXT:-./frontend/src/platform/ee-stubs}:/ee:ro
    networks:
      - ragsuite-server-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        FRONTEND_API_URL: ${FRONTEND_API_URL:-http://localhost:9090}
      additional_contexts:
        ee: ${RAGSUITE_EE_DOCKER_CONTEXT:-./frontend/src/platform/ee-stubs}
    ports:
      - "${WEB_PORT:-9191}:80"
      - "${API_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ragsuite-server-net
    restart: unless-stopped

volumes:
  postgres_data:
  es_data:
  minio_data:
