# Example: serve admin SPA at https://ragsuite.thebetaspace.com/ (Apache DocumentRoot)
# and proxy API + rag-config to Uvicorn on 127.0.0.1:8000.
#
# Enable: a2enmod proxy proxy_http headers ssl
# Adjust paths and upstream port as needed.

<VirtualHost *:443>
    ServerName ragsuite.thebetaspace.com
    # SSLEngine on ... (your cert configuration)

    DocumentRoot /var/www/ragsuite-admin

    # Admin SPA (static)
    <Directory /var/www/ragsuite-admin>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

    ProxyPass        /rag-config.js http://127.0.0.1:8000/rag-config.js
    ProxyPassReverse /rag-config.js http://127.0.0.1:8000/rag-config.js

    # CORS for embeddable widget assets (TYPO3 / external sites)
    <LocationMatch "^/(widget|search-widget)/v1/">
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, OPTIONS"
        Header always set Access-Control-Allow-Headers "*"
    </LocationMatch>
</VirtualHost>

# In index.html, BEFORE the main app script, use same-origin config:
# <script src="/rag-config.js?relative=1"></script>
