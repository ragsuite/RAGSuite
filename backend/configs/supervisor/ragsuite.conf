; RAGSuite supervisor configuration template.
; Copy to /etc/supervisor/conf.d/ragsuite.conf and replace __INSTALL_ROOT__ with the
; absolute path to this repo on the server (e.g. /Users/arun/Documents/RAGSuite_Server/backend).
; Reload with: sudo supervisorctl reread && sudo supervisorctl update

[program:ragsuite-backend]
command=__INSTALL_ROOT__/.venv/bin/gunicorn app.main:app -c __INSTALL_ROOT__/gunicorn.conf.py
directory=__INSTALL_ROOT__
user=web
autostart=true
autorestart=true
startretries=3
stopwaitsecs=40
stdout_logfile=/var/log/supervisor/ragsuite-backend.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/ragsuite-backend-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=
    HOME="/home/web",
    WEB_CONCURRENCY="2",
    RUN_INLINE_WORKER="false",
    PATH="__INSTALL_ROOT__/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

[program:ragsuite-chromadb]
command=__INSTALL_ROOT__/.venv/bin/chroma run --host 127.0.0.1 --port 8003 --path __INSTALL_ROOT__/data/chroma_db
directory=__INSTALL_ROOT__
user=web
autostart=true
autorestart=true
startretries=5
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/ragsuite-chromadb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/ragsuite-chromadb-error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
environment=
    HOME="/home/web",
    PATH="__INSTALL_ROOT__/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

[program:ragsuite-worker]
command=__INSTALL_ROOT__/.venv/bin/python -m app.worker
directory=__INSTALL_ROOT__
user=web
autostart=true
autorestart=true
startretries=3
stopwaitsecs=40
stdout_logfile=/var/log/supervisor/ragsuite-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/ragsuite-worker-error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
environment=
    HOME="/home/web",
    RUN_INLINE_WORKER="false",
    PATH="__INSTALL_ROOT__/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

[group:ragsuite]
programs=ragsuite-chromadb,ragsuite-backend,ragsuite-worker
